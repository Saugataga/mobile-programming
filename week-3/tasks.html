<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="task.js"></script>
    <link rel="stylesheet" href="task.css">
    <title>Document</title>
</head>
<body>
<div id="profile-card">
    
    <section class="profile-content">
        <img src="imagemain.jpg" alt="Profile Image" id="profile-photo">

        Name: <p id="student-name">Saugat Parajuli</p>
        Bio: <p id="bio">This is a class assigment.</p>
        <div id="skills-list">
            <h3>Skills: </h3>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ul>
        </div>
            <input type="text" id="nickname-input" value="Test Name">

    </section>

</div>
<section class="card-controls">
    <button id="nameshow">Show Name</button>
    <p id="output"></p>
    <button id="change-name">Change Name</button>
    <button id="show-bio">Show Bio</button>
    <button id="get-input">Get Input</button>
    <button id="change-nickname">Set Input</button>
    <button id="highlight-card">Highlight Card</button>
    <button id="remove-highlight">Remove Highlight</button>
    <button id="dark-mode">Toggle Dark Mode</button>
    <button id="toggle-round">Toggle Round</button>
    <button id="red">Red Background</button>
    <button id="reset">Reset</button>
    <button id="hide-photo">Hide Photo</button>
    <button id="show-photo">Show Photo</button>
    <button id="toggle-bio">Toggle Bio</button>
    <button id="animate-card">Animate Card</button>
</section>
<div class="fadestuff">
    <button id="fade-out">Fade Out Card</button>
    <button id="fade-in">Fade In Card</button>
    <button id="fade-50">Fade Out 50%</button>
    <button id="slide-up-skills">Slide Up Skills</button>
    <button id="slide-down-skills">Slide Down Skills</button>
    <button id="slide-toggle-skills">Slide Toggle Skills</button>
</div>  
</body>
</html>
