<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>
   function addNumber(){
        let number1 = Number(document.getElementById("number").value);
        let number2 = Number(document.getElementById("number2").value);
        let sum = number1 + number2;
        
        document.getElementById("result").innerText = "The sum is: " + sum;
   }
</script>

    <form>
        <input type="number" name="number" id="number" placeholder="Enter a number">
        <input type="number" name="number2" id="number2" placeholder="Enter another number">
        <button type="submit" onclick="addNumber()">Submit</button>
    </form>

    <p id="result"></p>
</body>
</html>
