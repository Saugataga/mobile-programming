<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact here</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --ink: #172033;
            --muted: #667085;
            --paper: #fffdf8;
            --line: #d9d3c7;
            --accent: #e76f51;
            --accent-dark: #c9543a;
            --highlight: #f4c95d;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 28px 16px;
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(circle at 12% 15%, rgba(244, 201, 93, 0.35), transparent 25%),
                radial-gradient(circle at 88% 85%, rgba(231, 111, 81, 0.2), transparent 30%),
                #f1eee8;
            color: var(--ink);
        }

        .contact-card {
            position: relative;
            width: min(100%, 540px);
            padding: 42px 42px 38px;
            overflow: hidden;
            background: var(--paper);
            border: 1px solid rgba(23, 32, 51, 0.1);
            border-radius: 4px 22px 4px 22px;
            box-shadow: 14px 14px 0 rgba(23, 32, 51, 0.08);
        }

        .contact-card::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 9px;
            background: var(--accent);
        }

        .contact-card::after {
            content: "";
            position: absolute;
            top: -52px;
            right: -42px;
            width: 150px;
            height: 150px;
            border: 22px solid rgba(244, 201, 93, 0.45);
            border-radius: 50%;
        }

        h1 {
            position: relative;
            z-index: 1;
            margin: 0 0 8px;
            font-size: clamp(2rem, 6vw, 2.7rem);
            line-height: 1;
            letter-spacing: -0.05em;
        }

        h1::after {
            content: "LET'S TALK";
            display: block;
            margin-top: 12px;
            color: var(--accent);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.2em;
        }

        form {
            position: relative;
            z-index: 1;
            display: grid;
            gap: 20px;
            margin-top: 30px;
        }

        label {
            margin-bottom: 8px;
            display: inline-block;
            color: var(--muted);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid var(--line);
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.5);
            color: var(--ink);
            font: inherit;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        input:focus,
        textarea:focus {
            border-color: var(--accent);
            background: #ffffff;
            box-shadow: 4px 4px 0 rgba(231, 111, 81, 0.18);
        }

        input::placeholder,
        textarea::placeholder {
            color: #a5a09a;
        }

        textarea {
            min-height: 132px;
            resize: vertical;
        }

        button {
            margin-top: 2px;
            padding: 15px 20px;
            border: 2px solid var(--ink);
            border-radius: 2px;
            background: var(--ink);
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.08s ease;
        }

        button:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        button:active {
            transform: translate(2px, 2px);
        }

        #details {
            position: relative;
            z-index: 1;
            margin-top: 28px;
            font-family: Arial, Helvetica, sans-serif;
        }

        #details p {
            margin: 0 0 9px;
            padding: 13px 15px;
            border-left: 4px solid var(--highlight);
            background: #f5f0e8;
            color: var(--muted);
            font-size: 0.88rem;
            overflow-wrap: anywhere;
        }

        #details p:last-child {
            margin-bottom: 0;
        }

        @media (max-width: 520px) {
            .contact-card {
                padding: 34px 26px 30px;
            }
        }
    </style>
</head>
<body>
    <section class="contact-card">
        <h1>Contact Us</h1>
        <form onsubmit="event.preventDefault(); writeUserData(name.value, email.value, message.value);">
            <div>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your Name Goes Here" required>
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Your Email Goes Here" required>
            </div>
            <div>
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Your Message Goes Here" required></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>
        <div id="details"></div>
    </section>
    <script type="module" src="form.js"></script>
</body>
</html>
